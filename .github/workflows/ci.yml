name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck upload.sh

      - name: actionlint
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_x86_64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint action.yml .github/workflows/*.yml

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: bash test/smoke.sh

